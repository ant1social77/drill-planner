<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drill &amp; Training Planner</title>
<style>
:root{
  --navy:#0f2a43; --navy2:#173a5a; --accent:#e8833a; --accent2:#d06d22;
  --ok:#2e8b57; --warn:#c98a00; --bad:#c0392b; --muted:#6b7a88;
  --peach:#fbe4d5; --a2head:#e0edd9; --grey:#d9d9d9; --band:#d6e6ea; --line:#333;
  --bg:#e8ecef;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#111}
button{font:inherit;cursor:pointer}
input,select{font:inherit}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 14px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:8px}
.brand b{font-size:15px;letter-spacing:.5px}
.brand span{font-size:11px;opacity:.75}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:6px 12px;font-size:13px}
.tab.on{background:#fff;color:var(--navy);border-color:#fff;font-weight:bold}
.spacer{flex:1}
.btn{border:1px solid #c5ced6;background:#fff;color:#123;border-radius:6px;padding:6px 11px;font-size:13px}
.btn:hover{background:#f2f5f7}
.btn.dark{background:var(--navy2);color:#fff;border-color:rgba(255,255,255,.25)}
.btn.dark:hover{background:#21507a}
.btn.gen{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:bold;padding:7px 14px}
.btn.gen:hover{background:var(--accent2)}
.btn.small{padding:3px 8px;font-size:12px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent}

/* ---------- views ---------- */
.view{display:none;padding:18px 10px 60px}
.view.on{display:block}
.toolbar{max-width:1120px;margin:0 auto 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar label{font-size:13px;color:#334}
.hint{font-size:12px;color:var(--muted)}

/* ---------- paper pages (annex replica) ---------- */
.page{background:#fff;width:1120px;max-width:100%;margin:0 auto 22px;padding:26px 30px 30px;
  box-shadow:0 1px 4px rgba(0,0,0,.18);position:relative}
.band{border:1.5px solid #4b6b78;background:var(--band);padding:4px 10px 3px;margin-bottom:12px}
.band .t{text-align:center;font-weight:bold;font-size:17px;letter-spacing:.2px}
.band .m{display:grid;grid-template-columns:1.3fr 1fr 1fr .8fr;font-size:12px;margin-top:2px}
.band .m span:nth-child(2){text-align:left}
.band .m span:nth-child(3){text-align:center}
.band .m span:nth-child(4){text-align:right}
.vbox{display:grid;grid-template-columns:150px 1fr 70px 120px;border:1px solid var(--line);margin-bottom:12px}
.vbox div{padding:8px 10px;border-right:1px solid var(--line);font-size:13px}
.vbox div:last-child{border-right:0}
.vbox .lb{background:var(--peach);font-weight:bold}
.vbox.a2 .lb{background:var(--a2head)}
.vbox .v{text-align:center;font-weight:bold;font-size:14px}
.vbox.a2 .v{font-family:"Times New Roman",serif;font-size:20px}
.bul{border:1px solid var(--line);padding:6px 14px 6px 10px;margin-bottom:14px;font-size:12.5px}
.bul div{display:flex;gap:10px;margin:2px 0}
.bul div:before{content:"➢";flex:0 0 auto}

table.grid{border-collapse:collapse;width:100%;table-layout:fixed;font-size:12px}
table.grid th,table.grid td{border:1px solid var(--line);padding:2px 4px;vertical-align:middle}
table.grid thead th{background:var(--peach);font-weight:bold;text-align:center;font-size:12px}
table.grid.a2 thead th{background:var(--a2head)}
table.grid thead th.st{text-align:left;font-size:12.5px}
table.grid thead th.st small{font-weight:normal;font-size:11.5px}
td.no{text-align:center}
td.ti{line-height:1.2}
td.ti .n{font-style:italic;font-size:10.5px}
td.ti .r{font-style:italic;font-size:10.5px}
td.fq{text-align:center}
td.vert{text-align:center;padding:4px 2px}
td.vert div{writing-mode:vertical-rl;transform:rotate(180deg);margin:auto;font-size:11.5px;line-height:1.25}
td.m{text-align:center;cursor:pointer;height:24px;font-size:12px;position:relative;white-space:nowrap}
td.m.g{background:var(--grey)}
td.m:hover{outline:2px solid var(--accent);outline-offset:-2px}
td.m.hw{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;font-size:13px;color:#1c2b6b}
td.m .np{font-size:8px;letter-spacing:-.2px;line-height:1.05;white-space:normal;display:block}
td.m.sel{outline:2px solid var(--navy);outline-offset:-2px}
td.narow{position:relative;cursor:pointer;height:22px;text-align:center}
td.narow:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid #222}
td.narow span{position:relative;background:#fff;padding:0 6px;font-family:"Times New Roman",serif;font-size:12px}
tr.sub td.ti{background:#cfcfcf}
tr.sub td{height:22px}
td.notes{font-size:12px;padding:6px 10px;line-height:1.35;font-style:italic}
td.notes b{font-style:normal}
.notes-out{font-size:12.5px;padding:6px 6px;line-height:1.35;font-style:italic}
.duelayer{position:absolute;top:0;left:100%;width:96px;height:100%;pointer-events:none}
.dl-h,.dl-r{position:absolute;left:8px;display:flex;align-items:center;font-size:11px;white-space:nowrap}
.dl-h{font-weight:bold;color:#445}
@media screen and (max-width:1330px){.view#v-a1 .page,.view#v-a2 .page{margin-left:max(10px,calc(50% - 560px - 52px))}}
span.chip{display:inline-block;padding:1px 6px;border-radius:10px;font-weight:bold;font-size:10.5px}
.chip.bad{background:#fde3df;color:var(--bad)} .chip.warn{background:#fff1cc;color:#8a5d00}
.chip.ok{background:#e1f2e7;color:var(--ok)} .chip.mut{background:#eef0f2;color:var(--muted)}
.chip.next{background:var(--accent);color:#fff}


/* ---------- cell editor ---------- */
#editor{position:absolute;z-index:80;background:#fff;border:1px solid #9fb0bd;border-radius:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);padding:10px;width:270px;display:none;font-size:13px}
#editor .hd{font-weight:bold;margin-bottom:2px}
#editor .sb{color:var(--muted);font-size:11.5px;margin-bottom:8px}
#editor input[type=text]{width:100%;padding:6px 8px;font-size:15px;border:1px solid #aab7c2;border-radius:5px}
#editor .row{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
#editor label{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:12px}

.empty{max-width:640px;margin:40px auto;text-align:center;background:#fff;padding:30px;border-radius:10px}
.sh{background:#fff;width:297mm;max-width:100%;margin:0 auto;padding:14mm 13mm;box-shadow:0 1px 4px rgba(0,0,0,.18)}
/* ---------- settings ---------- */
.set{background:#fff;max-width:820px;margin:0 auto;padding:20px 26px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.set h3{margin:18px 0 8px;font-size:15px;color:var(--navy);border-bottom:1px solid #dde3e8;padding-bottom:4px}
.set .f{display:grid;grid-template-columns:260px 1fr;gap:8px 14px;align-items:center;font-size:13px;margin:6px 0}
.set .f input[type=text],.set .f input[type=number],.set .f select{padding:5px 7px;border:1px solid #b9c6d0;border-radius:5px;max-width:300px}
.wd{display:flex;gap:6px;flex-wrap:wrap}
.wd label{border:1px solid #c5ced6;border-radius:5px;padding:3px 8px;font-size:12px}

#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2b38;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;z-index:100;pointer-events:none;max-width:90%}
#toast.on{opacity:1}

@media (max-width:760px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .set .f{grid-template-columns:1fr}
}

/* ---------- print ---------- */
@page{size:A4 landscape;margin:9mm}
@page sheet{size:A4 landscape;margin:12mm}
@media print{
  html,body{background:#fff}
  .topbar,.toolbar,.no-print,#editor,#toast,.scr{display:none!important}
  .prt{display:inline!important}
  .view{padding:0}
  .page,.sh{box-shadow:none;margin:0;width:100%;padding:0;overflow:visible}
  .sh{page:sheet}
  table.st th,.sh{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .page{page-break-after:always;break-after:page}
  .page:last-child{page-break-after:auto}
  th.due,td.due{display:none}
  td.m:hover{outline:none}
  tr.it.off{display:none}
  tr.sess td,table.pl th,.card,.alert,td.m.g,tr.sub td.ti,table.grid thead th,.band,.vbox .lb{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  h2.pt{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.pl{page-break-inside:auto} tr{page-break-inside:avoid}
}
</style>
<style id="sheetCss">
.sh{font-family:Arial,Helvetica,sans-serif;color:#000}
.shh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:2px;margin-bottom:calc(3mm * var(--fit,1))}
.sht{font-size:15pt;font-weight:bold}
.shs{font-size:10.5pt}
table.st{width:100%;border-collapse:collapse;font-size:calc(10.5pt * var(--fit,1));line-height:1.15}
table.st th{background:#e6e6e6;border:1px solid #000;padding:2px 4px;font-size:calc(10pt * var(--fit,1))}
table.st td{border:1px solid #000;padding:1px 5px;height:calc(5.6mm * var(--fit,1));vertical-align:middle}
table.st td.c{text-align:center;white-space:nowrap}
table.st td.main{font-weight:bold}
table.st td.sub{padding-left:10px}
table.st tr.gs td{border-top:2px solid #000}
.od{color:#c00}
.shf{font-size:9.5pt;margin-top:3mm}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><b id="tbVessel"></b><span>Drill &amp; Training Planner</span></div>
  <div class="tabs">
    <button class="tab" data-v="a1">Annex 1 · Drills</button>
    <button class="tab" data-v="a2">Annex 2 · Training</button>
    <button class="tab" data-v="plan">Список на месяц</button>
    <button class="tab" data-v="set">Настройки</button>
  </div>
  <div class="spacer"></div>
  <button class="btn gen" id="genBtn">⚙ Generate</button>
  <button class="btn dark" id="printBtn">🖨 Print</button>
  <button class="btn dark" id="expBtn" title="Сохранить резервную копию всех данных в файл">⬇ Export</button>
  <button class="btn dark" id="impBtn" title="Загрузить данные из файла резервной копии">⬆ Import</button>
  <input type="file" id="impFile" accept=".json,application/json" hidden>
</div>

<section class="view" id="v-a1">
  <div class="toolbar">
    <label>Год: <select class="yearSel"></select></label>
    <label><input type="checkbox" class="dueTog" checked> Показывать сроки (Next due)</label>
    <span class="hint">Нажми на клетку месяца, чтобы вписать или исправить дату. Пример: <b>17</b>, <b>14/24</b>, <b>Not Possible</b>, <b>N/A</b>.</span>
  </div>
  <div id="a1pages"></div>
</section>

<section class="view" id="v-a2">
  <div class="toolbar">
    <label>Год: <select class="yearSel"></select></label>
    <label><input type="checkbox" class="dueTog" checked> Показывать сроки (Next due)</label>
    <span class="hint">Нажми на клетку месяца, чтобы вписать или исправить дату.</span>
  </div>
  <div id="a2pages"></div>
</section>

<section class="view" id="v-plan">
  <div class="toolbar">
    <label>Месяц: <input type="month" id="planMonth"></label>
    <button class="btn" id="planPrint">🖨 Печать</button>
    <button class="btn" id="planWord">⬇ Word</button>
    <span class="hint">Список считается по датам в Annex 1 и Annex 2. Дату и время проведения заполняешь от руки.</span>
  </div>
  <div id="planOut"></div>
</section>

<section class="view" id="v-set"><div class="set" id="setOut"></div></section>

<div id="editor"></div>
<div id="toast"></div>

const refOf=r=>{ if(r.annex===2){const m=/^g(\d)([senb])(\d+)$/.exec(r.id); const p={s:'',n:'N',e:'E',b:'B'}[m[2]]; return `A2·G${m[1]}-${p}${m[3]}`;} return `A1·${r.sec.ref}-${r.no.replace('.','')}`; };

/* =====================================================================

   ===================================================================== */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);};
const fmt=d=>d?`${pad(d.getDate())}-${MON[d.getMonth()]}-${String(d.getFullYear()).slice(2)}`:'—';
const fmtL=d=>d?`${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]} ${pad(d.getDate())}-${MON[d.getMonth()]}`:'—';
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
function addMonths(d,n){const y=d.getFullYear(),m=d.getMonth()+n,last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(d.getDate(),last));}
const addIv=(d,iv)=>iv.d?addDays(d,iv.d):addMonths(d,iv.m);
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());};
const ruMonth=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

/* =====================================================================
   CELL LOGIC
   ===================================================================== */
const ck=(id,y,m)=>`${id}|${y}|${m}`;
function parseCell(v){
  v=(v||'').trim(); if(!v) return {days:[]};
  if(/^n\s*\/?\s*a$/i.test(v)) return {days:[],na:true};
  if(/not\s*poss/i.test(v)) return {days:[],np:true};
  return {days:(v.match(/\d{1,2}/g)||[]).map(Number).filter(x=>x>=1&&x<=31)};
}
function rowIsNA(id,y){return !!S.rowNA[`${id}|${y}`];}
function applicable(r,y){ if(r.ap&&!S.settings[r.ap]) return false; if(rowIsNA(r.id,y)) return false; return true; }
function interval(r){
  const st=S.settings;
  if(st.flag==='malta'&&(r.id==='as1'||r.sec.id==='FIRE')) return {d:14};
  if(st.flag==='mi'&&r.id==='e12') return {m:3};
  if(r.sec.rot) return {m:1};
  const m=/^(\d)M$/.exec(r.f||''); return m?{m:+m[1]}:null;
}
/* last completion strictly before `before` (Date) ; N/A counts as completion on the 1st */
function lastDone(id,before){
  let best=null; const pre=id+'|';
  for(const k in S.cells){ if(!k.startsWith(pre)) continue;
    const [,y,m]=k.split('|').map(Number); const p=parseCell(S.cells[k]);
    const ds=p.na?[1]:p.days;
    for(const day of ds){ const last=new Date(y,m+1,0).getDate(); const d=new Date(y,m,Math.min(day,last));
      if(before&&d>=before) continue; if(!best||d>best) best=d; } }
  return best;
}
function addDay(id,date){
  const k=ck(id,date.getFullYear(),date.getMonth()); const p=parseCell(S.cells[k]);
  let days=(p.na||p.np)?[]:p.days.slice(); const dd=date.getDate();
  if(!days.includes(dd)) days.push(dd); days.sort((a,b)=>a-b);
  S.cells[k]=days.map(pad).join('/');
}
function removeDay(id,date){
  const k=ck(id,date.getFullYear(),date.getMonth()); const p=parseCell(S.cells[k]);
  const days=p.days.filter(x=>x!==date.getDate());
  if(days.length) S.cells[k]=days.map(pad).join('/'); else delete S.cells[k];
}
function nextDue(r){ // as of today, for the Next-due column
  const iv=interval(r); if(!iv) return null; const l=lastDone(r.id); return l?addIv(l,iv):'never';
}

function band(A,pi,n){return `<div class="band"><div class="t">${A.code}</div><div class="m"><span>Policy and Administration Manual</span><span>${A.date}</span><span>${A.rev}</span><span>Page ${pi} of ${n}</span></div></div>`;}
function vbox(ax){const st=S.settings;return `<div class="vbox ${ax===2?'a2':''}"><div class="lb">Vessel</div><div class="v">${st.vessel?esc(st.vessel):'<span class="no-print" style="color:#b33;font-weight:normal;font-size:12px">укажи название судна в «Настройках»</span>'}</div><div class="lb">Year</div><div class="v">${viewYear}</div></div>`;}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let viewYear=2026;

function rotPick(sec,before){
  const rows=sec.rows.filter(r=>!r.sub&&applicable(r,(before||today()).getFullYear()));
  let pick=null,pl;
  for(const r of rows){ const l=lastDone(r.id,before), lv=l?l.getTime():-Infinity;
    if(pick===null||lv<pl){pick=r;pl=lv;} }
  return pick;
}
function dueCell(r){
  if(!S.settings.showDue) return '';
  if(r.f==='As required') return `<span class="chip mut">as req.</span>`;
  if(!applicable(r,viewYear)) return `<span class="chip mut">n/a</span>`;
  if(r.sec.rot){ const p=rotPick(r.sec); return p&&p.id===r.id?'<span class="chip next">◀ next</span>':''; }
  const d=nextDue(r); if(!d) return '';
  if(d==='never') return `<span class="chip bad">no record</span>`;
  const t=today(), diff=(d-t)/864e5;
  const cls=diff<0?'bad':diff<=31?'warn':'ok';
  return `<span class="chip ${cls}">${fmt(d)}</span>`;
}
function secTable(s){
  const a2=s.annex===2, y=viewYear, nrows=s.rows.length;
  let h=`<table class="grid ${a2?'a2':''}"><colgroup><col style="width:4.5%"><col style="width:${a2?'40%':'37.5%'}"><col style="width:${a2?'6%':'8.5%'}">${'<col>'.repeat(12)}</colgroup>`;
  h+=`<thead><tr><th class="st" colspan="2">${s.title}${s.sub?`<br><small>${s.sub}</small>`:''}</th><th>Freq.</th>${MON.map(m=>`<th>${m}</th>`).join('')}</tr></thead><tbody>`;
  s.rows.forEach((r,i)=>{
    if(r.sub){ h+=`<tr class="sub"><td></td><td class="ti">${r.sub}</td><td></td>${'<td></td>'.repeat(12)}</tr>`; return; }
    h+=`<tr data-rid="${r.id}"><td class="no">${r.no}</td><td class="ti">${r.t}${r.n?`<div class="n">${r.n}</div>`:''}</td>`;
    if(s.vert){ if(i===0) h+=`<td class="vert" rowspan="${nrows}"><div>${s.vert}</div></td>`; }
    else h+=`<td class="fq">${r.f||''}</td>`;
    if(rowIsNA(r.id,y)) h+=`<td class="narow" colspan="12" data-id="${r.id}" data-m="0"><span>N/A</span></td>`;
    else for(let m=0;m<12;m++){ const v=S.cells[ck(r.id,y,m)]||''; const p=parseCell(v);
      const inner=p.np?`<span class="np">Not<br>Possible</span>`:esc(v);
      h+=`<td class="m${r.g.includes(m)?' g':''}" data-id="${r.id}" data-m="${m}">${inner}</td>`; }
    h+='</tr>';
  });
  if(s.notesRow) h+=`<tr><td colspan="15" class="notes" style="font-style:italic">${s.notesRow}</td></tr>`;
  if(s.notes) h+=`<tr><td colspan="15" class="notes">${s.notes}</td></tr>`;
  h+='</tbody></table>';
  if(s.after) h+=`<div class="notes-out">${s.after}</div>`;
  return h;
}
function renderAnnex(ax){
  const A=ax===1?A1:A2, n=A.pages.length;
  document.getElementById(ax===1?'a1pages':'a2pages').innerHTML=A.pages.map((pg,pi)=>{

/* Next-due chips live OUTSIDE the paper (grey margin on the right) – never printed */
function placeDue(ax){
  if(!S.settings.showDue) return;
  document.querySelectorAll(`#${ax===1?'a1pages':'a2pages'} .page`).forEach(pg=>{

function normCell(v){ const p=parseCell(v); if(p.na) return 'N/A'; if(p.np) return 'Not Possible'; if(p.days.length) return [...new Set(p.days)].sort((a,b)=>a-b).map(pad).join('/'); return v; }

/* =====================================================================
   GENERATOR — list of drills & trainings due next month (no dates)
   ===================================================================== */
const SESS_OF={as1:'AS',as2:'AS',as3:'AS',as4:'AS',t1:'AS',t2:'AS',t3:'AS',t6:'AS',t11:'AS',e12:'AS',
  t4:'FIRE',t5:'FIRE',e8:'FIRE',
  t7:'MED',t8:'MED',e7:'MED',e10:'MED',
  t9:'ENG',t10:'ENG',t13:'ENG',e1:'ENG',e2:'ENG',e3:'ENG',e4:'ENG',e5:'ENG',e6:'ENG',e9:'ENG',e11:'ENG',
  s1:'SEC',s2:'SEC',s3:'SEC',p1:'PREP',p2:'PREP',pc1:'PREP'};
const KORD={FIRE:1,AS:2,MED:3,ENG:4,SEC:5,PREP:6};
function evalRow(r,F,L){
  const iv=interval(r); if(!iv) return null;
  const last=lastDone(r.id,F), due=last?addIv(last,iv):null;
  if(due&&due>L) return null;
  return {id:r.id,last,due,over:!due||due<F};
}
function generate(y,m){
  const st=S.settings, F=new Date(y,m,1), L=new Date(y,m+1,0), items=[];
  for(const s of Object.values(SECS)){ if(s.annex!==1) continue;
    if(s.rot){ const rows=s.rows.filter(r=>applicable(r,y)); if(!rows.length) continue;
      let last=null; rows.forEach(r=>{const l=lastDone(r.id,F); if(l&&(!last||l>last)) last=l;});
      const due=last?addIv(last,interval(rows[0])):null;
      items.push({id:rotPick(s,F).id,rot:s.rot,last,due,over:!due||due<F}); continue; }
    for(const r of s.rows){ if(r.sub||!applicable(r,y)||r.f==='As required') continue; const e=evalRow(r,F,L); if(e) items.push(e); }
  }
  const eff=i=>i.over?addDays(F,-1):i.due;
  const engHas=items.some(i=>!i.rot&&SESS_OF[i.id]==='ENG');
  const keyOf=i=>i.rot==='fire'?'FIRE':i.rot==='oil'?(engHas?'ENG':'FIRE'):SESS_OF[i.id];
  const by={}; items.forEach(i=>(by[keyOf(i)]=by[keyOf(i)]||[]).push(i));
  let groups=[];
  for(const k in by){ let cur=null;
    for(const it of by[k].sort((a,b)=>eff(a)-eff(b))){
      if(!cur||((eff(it)-cur.dl)/864e5>(+st.split||14)&&!it.rot)){ cur={key:k,dl:eff(it),items:[]}; groups.push(cur); }
      cur.items.push(it); } }
  if(st.pairAsFire){ const f=groups.find(g=>g.key==='FIRE'), a=groups.find(g=>g.key==='AS');
    if(f&&a){ f.items.push(...a.items); f.dl=new Date(Math.min(f.dl,a.dl)); groups=groups.filter(g=>g!==a); } }
  /* Annex 1 order: drills first (as they appear in the Annex), combined trainings right under them */
  groups.forEach(g=>g.items.sort((a,b)=>(isTrg(a)-isTrg(b))||ordIn(a)-ordIn(b)));
  groups.sort((a,b)=>ordIn(a.items[0])-ordIn(b.items[0]));
  const tr=[];
  for(const s of Object.values(SECS)){ if(s.annex!==2) continue;
    for(const r of s.rows){ if(r.sub||!applicable(r,y)) continue; const e=evalRow(r,F,L); if(e) tr.push(e); } }
  tr.sort((a,b)=>ordIn(a)-ordIn(b));
  return {groups,trainings:tr};
}
const ORD=Object.keys(ROW); const ordIn=i=>ORD.indexOf(i.id);
const isTrg=i=>!i.rot&&ROW[i.id].sec.id==='TR'&&!/drill/i.test(label(ROW[i.id]));
function itemName(i){
  if(i.rot==='fire') return 'Fire drill';
  if(i.rot==='oil') return 'Oil spill / pollution response drill';
  const r=ROW[i.id], a=label(r), b=strip(r.t).replace(/\s*[-–]\s*Refer\b.*$/,'');
  let n=(['AS','TR','EM'].includes(r.sec.id)&&b.length<a.length&&b.length>8?b:a).replace(/\s*#$/,'').replace(/[.,]$/,'');
  if(ROW[i.id].sec.id==='TR'&&!/drill/i.test(n)) n+=' (training)';
  return n;
}

    h+=`<tr><td class="c">${i+1}</td><td>${esc(label(r))}</td><td class="c">${GRP[r.grp||r.sec.grp]||''}</td><td class="c">${fq(t)}</td><td class="c">${last(t)}</td><td></td><td></td></tr>`; });
  if(!P.trainings.length) h+=`<tr><td colspan="7" class="c">—</td></tr>`;
  h+=`</tbody></table></div>`;
  return h;
}

function renderSettings(){
  const st=S.settings;
  const chk=(k,t)=>`<div class="f"><span>${t}</span><span><input type="checkbox" data-k="${k}" ${st[k]?'checked':''}></span></div>`;
  document.getElementById('setOut').innerHTML=`
  <h3 style="margin-top:0">Судно</h3>
  <div class="f"><span>Название судна</span><input type="text" data-k="vessel" value="${esc(st.vessel)}" placeholder="название вашего судна"></div>
  <div class="f"><span>Флаг (влияет на интервалы)</span><select data-k="flag">
     <option value="other" ${st.flag==='other'?'selected':''}>Другой / стандартные интервалы</option>
     <option value="malta" ${st.flag==='malta'?'selected':''}>Malta — Abandon ship и Fire drill каждые 14 дней</option>
     <option value="mi" ${st.flag==='mi'?'selected':''}>Marshall Islands — MOB каждые 3 месяца</option></select></div>
  ${chk('rescueBoat','Rescue boat (кроме L/B) установлен')}${chk('davitLR','Davit-launched L/R установлен')}${chk('opl','Overridable Power Limitation (OPL) установлен')}
  ${chk('panama','PCSOPEP (Панамский канал) — применимо')}${chk('uscg','USCG PREP (VRP / NTVRP) — применимо')}
  <h3>Список на месяц</h3>
  ${chk('pairAsFire','Fire drill и Abandon ship — одной строкой (один день)')}
  <h3>Данные</h3>
  <p class="hint">Все даты хранятся в этом браузере на этом компьютере. Регулярно делай <b>Export</b> — это резервная копия в одном файле. На другом компьютере открой этот же HTML и нажми <b>Import</b>.</p>
  <p class="hint">Записей в Annex: ${Object.keys(S.cells).length} · ${storageOK?'сохранение в браузере работает':'<b style="color:var(--bad)">сохранение в браузере НЕ работает — делай Export</b>'}</p>
  <button class="btn" id="wipe" style="color:var(--bad)">Очистить все данные…</button>`;
}
document.getElementById('setOut').addEventListener('change',e=>{
  const t=e.target, st=S.settings;
  if(t.dataset.wd!==undefined){ const i=+t.dataset.wd; st.weekdays=t.checked?[...new Set([...st.weekdays,i])]:st.weekdays.filter(x=>x!==i); }
  else if(t.dataset.k){ const k=t.dataset.k;
    if(t.type==='checkbox') st[k]=t.checked;
    else if(k==='times') st.times=t.value.split(/[,;\s]+/).filter(x=>/^\d{1,2}:\d{2}$/.test(x));
    else if(t.type==='number') st[k]=+t.value; else st[k]=t.value; }
  save(); document.getElementById('tbVessel').textContent=st.vessel||'Vessel —'; toast('Сохранено');
});
document.getElementById('setOut').addEventListener('click',e=>{
  if(e.target.id==='wipe'&&confirm('Удалить ВСЕ даты, планы и настройки? Сначала лучше сделать Export.')){ S=blank(); save(); rerender(); toast('Данные очищены'); }
});

/* =====================================================================
   SHELL
   ===================================================================== */
let curView='a1';
function show(v){ curView=v; document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v)); closeEditor();
  if(v==='a1') renderAnnex(1); if(v==='a2') renderAnnex(2); if(v==='plan') renderPlan(); if(v==='set') renderSettings();
  try{sessionStorage.setItem('dpView',v);}catch(e){} }
function rerender(){ fillYears(); show(curView); updGen(); document.getElementById('tbVessel').textContent=S.settings.vessel||'Vessel —'; }
function nextYm(){ const t=today(); const d=new Date(t.getFullYear(),t.getMonth()+1,1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
function updGen(){ const [y,m]=nextYm().split('-').map(Number); document.getElementById('genBtn').textContent=`⚙ Generate · ${MON[m-1]} ${y}`; }
function fillYears(){ const ys=new Set([today().getFullYear(),today().getFullYear()+1,+S.settings.year]);
  Object.keys(S.cells).forEach(k=>ys.add(+k.split('|')[1]));
  document.querySelectorAll('.yearSel').forEach(sel=>{ sel.innerHTML=[...ys].sort().map(y=>`<option ${y===viewYear?'selected':''}>${y}</option>`).join(''); });
  document.querySelectorAll('.dueTog').forEach(c=>c.checked=!!S.settings.showDue); }
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.v));
document.querySelectorAll('.yearSel').forEach(s=>s.onchange=()=>{viewYear=+s.value; rerender();});
document.querySelectorAll('.dueTog').forEach(c=>c.onchange=()=>{S.settings.showDue=c.checked; save(); rerender();});
document.getElementById('genBtn').onclick=()=>doGenerate(nextYm());
document.getElementById('planPrint').onclick=()=>window.print();
document.getElementById('planWord').onclick=downloadWord;
document.getElementById('planMonth').onchange=renderPlan;
document.getElementById('printBtn').onclick=()=>{ closeEditor(); window.print(); };
document.getElementById('expBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify({...S,exported:new Date().toISOString()},null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`DrillPlanner_${(S.settings.vessel||'backup').replace(/\W+/g,'_')}_${ymd(today())}.json`; document.body.appendChild(a); a.click(); a.remove();
  toast('Резервная копия сохранена');
};
document.getElementById('impBtn').onclick=()=>document.getElementById('impFile').click();
document.getElementById('impFile').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!confirm('Заменить текущие данные данными из файла?')) return; applyImport(d,false); save(); rerender(); toast('Данные загружены'); }catch(err){ alert('Это не файл резервной копии Drill Planner'); } e.target.value=''; };
  rd.readAsText(f); };
let tt; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2600); }

load();
viewYear=today().getFullYear(); if(!Object.keys(S.cells).some(k=>k.split('|')[1]==viewYear)) viewYear=+S.settings.year||viewYear;
document.getElementById('planMonth').value=nextYm();
let v0='a1'; try{v0=sessionStorage.getItem('dpView')||'a1';}catch(e){}
rerender(); show(v0);
</script>
</body>
</html>
